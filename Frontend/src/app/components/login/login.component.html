<div class="auth-container">
  <div class="auth-left"></div>
  <div class="auth-right">
    <form class="auth-card">

      <h2>Bienvenue</h2>

      <div class="form-group">
        <label>E-mail</label>
        <div class="input-wrapper">
          <input type="email" placeholder="votre@email.com" [(ngModel)]="email" name="email" required />
          <i class="fa-solid fa-envelope input-icon"></i>
        </div>
      </div>

      <div class="form-group">
        <label>Mot de passe</label>
        <div class="input-wrapper">
          <input type="password" placeholder="••••••••••••" [(ngModel)]="mdp" name="mdp" required />
          <i class="fa-solid fa-eye-slash input-icon"></i>
        </div>
      </div>

      <button type="button" class="login-btn" (click)="login()">Connexion</button>

      <p class="auth-note">
        Si vous avez oublié votre mot de passe ou si vous n'avez pas de compte,
        veuillez contacter l'administrateur.
      </p>

    </form>
  </div>

</div>
